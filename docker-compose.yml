services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    ports:
      - "5001:5001"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      FRONTEND_URL: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        VITE_API_BASE_URL: http://localhost:5001
        VITE_API_URL: http://localhost:5001/api
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
